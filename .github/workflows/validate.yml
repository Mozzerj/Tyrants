name: Validate Tyrants

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mission source
        uses: actions/checkout@v4
      - name: Run Tyrants static validator
        run: python3 tools/validate_project.py
